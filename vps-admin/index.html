<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp Manutenção — VPS</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#f4f6f3;color:#1f2f27}main{max-width:850px;margin:32px auto;padding:24px;background:white;border-radius:16px}button,input{font:inherit}button{padding:9px 14px;margin:4px;border:0;border-radius:8px;cursor:pointer;background:#245f45;color:white}.danger{background:#8c2f22}.secondary{background:#e5ece7;color:#1f2f27}.row{display:flex;gap:8px;flex-wrap:wrap}.card{border:1px solid #d8e2d6;border-radius:10px;padding:14px;margin:14px 0}.chat{display:block;padding:6px}.muted{color:#607167;font-size:13px}#qr{max-width:320px}#notice{white-space:pre-wrap;color:#8c2f22}.hidden{display:none}</style></head><body><main>
<h1>WhatsApp Manutenção — VPS</h1><p class="muted">Painel privado. Acesse somente por túnel SSH para 127.0.0.1.</p>
<div class="card"><label>Token administrativo <input id="token" type="password" autocomplete="off"></label><button id="save">Usar token</button><p id="notice"></p></div>
<div class="card"><strong>Status:</strong> <span id="phase">—</span> · <span id="conn">—</span><div class="row"><button id="pair">Parear / gerar QR</button><button id="reconnect" class="secondary">Reconectar sessão</button><button id="edit" class="secondary">Editar autorizações</button><button id="block" class="danger">Bloquear acesso</button></div></div>
<div id="qr-card" class="card hidden"><h2>QR code</h2><img id="qr" alt="QR code do WhatsApp"></div>
<div id="choices-card" class="card hidden"><h2>Conversas e permissões</h2><div><label><input id="s-send" type="checkbox"> Enviar mensagens</label> <label><input id="s-create" type="checkbox"> Criar grupos</label> <label><input id="s-manage" type="checkbox"> Gerir grupos/participantes</label></div><div id="choices"></div><button id="authorize">Salvar autorização</button></div>
</main><script src="/admin/app.js" defer></script></body></html>
